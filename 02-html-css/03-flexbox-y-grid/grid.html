<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Ejemplos</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <h1>CSS Grid - Ejemplos Prácticos</h1>

    <!-- Ejemplo 1: Grid simple 3 columnas x 2 filas -->
    <section>
        <h2>1. Grid Simple (3 columnas × 2 filas)</h2>
        <div class="grid-simple">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
        </div>
    </section>

    <!-- Ejemplo 2: Grid con columnas de diferentes tamaños -->
    <section>
        <h2>2. Grid con Columnas de Diferentes Tamaños</h2>
        <div class="grid-sizes">
            <div class="item">Pequeña</div>
            <div class="item">Mediana</div>
            <div class="item">Grande</div>
            <div class="item">Pequeña</div>
            <div class="item">Mediana</div>
            <div class="item">Grande</div>
        </div>
    </section>

    <!-- Ejemplo 3: Grid con gap -->
    <section>
        <h2>3. Grid con Gap</h2>
        <div class="grid-gap">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
        </div>
    </section>

    <!-- Ejemplo 4: Elemento que ocupa varias columnas/filas -->
    <section>
        <h2>4. Elemento que Ocupa Múltiples Celdas</h2>
        <div class="grid-span">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
        </div>
    </section>

</body>
</html>
