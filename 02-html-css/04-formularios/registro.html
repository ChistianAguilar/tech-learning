<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formularios.css">
    <title>Document</title>
</head>
<body>
    <form action="/login" method="POST">

        <fieldset> <!-- Aprugar elementos relacionados -->

            <legend>Formulario de Registro</legend>

            <!-- Nombre -->
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <!-- Correo electronico -->
            <div>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="user_email" required placeholder="ejempli@gmail.com">
            </div>

            <!-- Contraceña -->
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="user_password" required placeholder="*************">
            </div>

            <!-- Fecha de nacimiento -->
            <div>
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            </div>

            <!-- Selector de país -->
            <div>
                <label for="pais">¿De qué pais eres?</label>
                <select name="pais">
                    <option value="">Seleccionar...</option>
                    <option value="py">Paraguay</option>
                    <option value="uk">The United Kingdom</option>
                    <option value="ar">Argentina</option>
                    <option value="cl">Chile</option>
                    <option value="jp">Japan</option>
                    <option value="ca">Canada</option>
                </select>
            </div>

            <!-- Boton para genero -->
            <div>
                <label for="genero">¿Cual es tu genero?</label>

                <input type="radio" id= "genero-m" name="genero" value="m">
                <label for="genero-m">Masculino</label>

                <input type="radio" id= "genero-f" name="genero" value="f">
                <label for="genero-f">Femenino</label>

                <input type="radio" id= "genero-p" name="genero" value="p">
                <label for="genero-p">Prefiero no decirlo</label>
            </div>

            <!-- Checkbox términos y condiciones -->
            <div>
                <input type="checkbox" id="terms">
                <label for="terms">Acepto los términos</label>
            </div>

            <button type="submit">Enviar</button>
        </fieldset>

    </form>
</body>
</html>
