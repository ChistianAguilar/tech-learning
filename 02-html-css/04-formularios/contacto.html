<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="formularios.css">
</head>
<body>
    <form action="" method="POST">

        <fieldset>

            <legend>Formulario de Contacto</legend>

            <!-- nombre -->
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="user_name" required>
            </div>

            <!-- email -->
            <div>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="user_email" required placeholder="ejemplo@gmail.com">
            </div>

            <!-- Asunto -->
            <div>
                <label for="asunto">Asunto</label>
                <select name="asunto" id="asunto">
                    <option value="">Seleccionar Asunto</option>
                    <option value="consulta">Consulta</option>
                    <option value="reclamo">Reclamo</option>
                    <option value="sugerencia">Sugerencia</option>
                </select>
            </div>
            
             <!-- Mensaje -->
            <div>
                <label for="mensaje">Deja tu comentario:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí"></textarea>
            </div>

            <!-- boton de enviar -->
            <button type="submit">Enviar</button>
        </fieldset>
    </form>

</body>
</html>
